name: Analisis Semanal de Inversiones

on:
  schedule:
    # Domingo 04:00 hora Bogotá = Domingo 09:00 UTC (UTC-5, sin horario de verano)
    - cron: '0 9 * * 0'
  workflow_dispatch:   # Permite ejecución manual desde GitHub

jobs:
  analisis:
    runs-on: ubuntu-latest
    # 45 min: además del portafolio escanea ~1.000 acciones de los ETFs de referencia
    timeout-minutes: 45

    # Necesario para que el bot pueda guardar el estado de las señales
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          # Historial completo: el paso final hace commit del estado de señales
          # y un clon superficial rompe el rebase antes del push.
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Paso aparte: es el unico que recibe el token de la hoja de órdenes.
      # Si falla, deja el portafolio como estaba y el analisis sigue.
      - name: Actualizar portafolio con órdenes de Hapi
        env:
          HAPI_ORDENES_URL:   ${{ secrets.HAPI_ORDENES_URL }}
          HAPI_ORDENES_TOKEN: ${{ secrets.HAPI_ORDENES_TOKEN }}
        run: python -m src.ordenes_hapi

      - name: Ejecutar análisis semanal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY:       ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          TIMEZONE:           America/Bogota
        run: python main.py --now

      # El contenedor se descarta al terminar, asi que la memoria de cuanto
      # lleva activa cada señal solo sobrevive si se guarda en el repositorio.
      - name: Guardar estado de señales
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado_senales.json
          git add data/estado_senales_etf.json 2>/dev/null || true
          git add portfolio.csv data/ordenes_hapi.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado de señales."
          else
            git commit -m "chore: estado de señales y órdenes $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
